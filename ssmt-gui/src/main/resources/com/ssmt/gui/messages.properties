label.stepTwo=2. Translate and review the entries in the Translation Editor. Save whenever you like.
label.stepThree=3. Use Make My Personal Copy when you are ready. Your original mod is never changed.
label.sourceSafety=Your original mod stays untouched. Project Go only writes your project file and a separate personal-use copy that you choose to create.
