dialog.permission.message=Project Go makes a translated copy for your own game. Keep this copy private. Enable it instead of the original mod, never both. Continue?
dialog.firstRun.title=Welcome to Project Go
dialog.firstRun.message=Project Go never changes your original mod. It makes a separate translated copy for your own game. Start or continue a project, translate and check the text, then make your personal copy. Enable that copy instead of the original mod, never both. AI drafting is optional. Keep generated copies private.
dialog.aiGuidance.title=How online AI exchange works
dialog.aiGuidance.message=Project Go exports a JSON package for you to paste into an AI tool. Import the returned JSON afterward. AI text is an untrusted draft: placeholders and identity keys are validated, imports are transactional, and nothing is accepted automatically. Review privacy and provider terms before sharing mod text.
