dialog.unsaved.message=This project has unsaved translation changes. Close anyway?
dialog.permission.title=Respect mod author permissions
dialog.permission.message=The translated clone and pristine backup contain the source mod's code and assets. Keep them for personal use unless the mod author permits redistribution. Enable the translated clone instead of the original mod, never both. Continue?
dialog.firstRun.title=Welcome to Starsector Mod Toolkit
dialog.firstRun.message=SSMT never modifies the source mod. A build creates a pristine source backup and a translated clone. Enable the translated clone instead of the original mod, never both. Create or open a sample project, translate and review entries, check fonts, then build. AI and OCR are optional, and redistribution requires author permission.
dialog.aiGuidance.title=How online AI exchange works
dialog.aiGuidance.message=SSMT exports a JSON package for you to paste into an AI tool. Import the returned JSON afterward. AI text is an untrusted draft: placeholders and identity keys are validated, imports are transactional, and nothing is accepted automatically. Review privacy and provider terms before sharing mod text.
