name: Release Project Go

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests and verification
        run: ./gradlew clean check --no-daemon

      - name: Verify tag matches source version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^ssmtVersion=//p' gradle.properties | tr -d '\r')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Release tag does not match ssmtVersion" >&2
            exit 1
          fi

      - name: Build committed distributions and check launch versions
        shell: bash
        run: |
          ./gradlew assemble :ssmt-cli:installDist :ssmt-gui:installDist :ssmt-auto:installDist --no-daemon
          VERSION=$(sed -n 's/^ssmtVersion=//p' gradle.properties | tr -d '\r')
          ssmt-cli/build/install/ssmt-cli/bin/ssmt-cli --version 2>&1 | grep -F "$VERSION"
          ssmt-gui/build/install/ssmt-gui/bin/ssmt-gui --version 2>&1 | grep -F "$VERSION"
          ssmt-gui/build/install/ssmt-gui/bin/ssmt-gui --smoke-test
          ssmt-auto/build/install/ssmt-auto/bin/ssmt-auto --version 2>&1 | grep -F "$VERSION"
          ssmt-auto/build/install/ssmt-auto/bin/ssmt-auto --smoke-test
          printf 'version=%s\ncommit=%s\n' "$VERSION" "$GITHUB_SHA" > build/reports/release-source.txt

      - name: Generate release evidence
        run: |
          ./gradlew \
            generateSbom \
            releaseChecksums \
            scanReleaseArchives \
            checkReleaseMetadata \
            --no-daemon

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v5
        with:
          name: Project-Go-release-evidence
          path: |
            build/reports/ssmt-sbom.cdx.json
            build/distributions/SHA256SUMS
            ssmt-cli/build/distributions/*.zip
            ssmt-gui/build/distributions/*.zip
            ssmt-auto/build/distributions/*.zip
            build/reports/release-source.txt
          if-no-files-found: error

  windows-portable:
    name: Windows portable build
    needs: verify
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and smoke-test Windows application
        shell: pwsh
        run: |
          .\gradlew.bat clean check --no-daemon
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
          .\gradlew.bat :ssmt-gui:developmentBundleChecksum --no-daemon
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
          $version = (Select-String '^ssmtVersion=' gradle.properties).Line.Split('=')[1]
          # jpackage projects semantic prerelease versions onto numeric EXE metadata.
          $nativeVersion = $version.Split('-')[0]
          foreach ($exe in @('ssmt-gui/build/jpackage/Project Go/Project Go.exe', 'ssmt-auto/build/jpackage/Project Go Auto/Project Go Auto.exe')) {
            if ((Get-Item $exe).VersionInfo.ProductVersion -ne $nativeVersion) { throw "Unexpected native version: $exe" }
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v5
        with:
          name: Project-Go-windows-x64
          path: |
            build/development/*.zip
            build/development/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - verify
      - windows-portable

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:
      - name: Download release evidence
        uses: actions/download-artifact@v5
        with:
          name: Project-Go-release-evidence
          path: release-assets

      - name: Download Windows build
        uses: actions/download-artifact@v5
        with:
          name: Project-Go-windows-x64
          path: release-assets/windows

      - name: Determine release type
        id: release_type
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" =~ (alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.release_type.outputs.prerelease }}
        shell: bash
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS="--prerelease"
          else
            FLAGS=""
          fi

          if ! gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              $FLAGS \
              --generate-notes
          fi

          find release-assets \
            -type f \
            \( -name "*.zip" \
            -o -name "*.sha256" \
            -o -name "SHA256SUMS" \
            -o -name "*.json" \
            -o -name "release-source.txt" \) \
            -print0 \
            | xargs -0 gh release upload "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber
